```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #1f2937;
            min-height: 100vh;
            transition: background 0.3s ease;
        }

        header {
            background: linear-gradient(135deg, #111827, #1d4ed8);
            color: white;
            padding: 25px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 28px;
        }

        header p {
            margin-top: 6px;
            color: #dbeafe;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.12);
            padding: 10px 15px;
            border-radius: 20px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
        }

        main {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .stat span {
            display: block;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat strong {
            font-size: 30px;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 22px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            margin-bottom: 22px;
        }

        .card h2 {
            margin-bottom: 18px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 17px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .success {
            background: #16a34a;
            color: white;
        }

        .form-actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }

        .event-list {
            display: grid;
            gap: 15px;
        }

        .event {
            border: 1px solid #e5e7eb;
            padding: 18px;
            border-radius: 12px;
            transition: 0.25s;
        }

        .event:hover {
            border-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37,99,235,0.08);
        }

        .event-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .event h3 {
            margin-bottom: 7px;
        }

        .badge {
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .tech {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .music {
            background: #fce7f3;
            color: #be185d;
        }

        .business {
            background: #dcfce7;
            color: #15803d;
        }

        .event p {
            color: #6b7280;
            font-size: 14px;
            margin: 5px 0;
        }

        .event-actions {
            margin-top: 14px;
            display: flex;
            gap: 8px;
        }

        .event-actions button {
            padding: 8px 11px;
        }

        .log {
            background: #111827;
            color: white;
            border-radius: 10px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
        }

        .log-entry {
            padding: 8px 0;
            border-bottom: 1px solid #374151;
        }

        .log-entry span {
            color: #60a5fa;
        }

        .event-info {
            display: grid;
            gap: 12px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 10px;
            background: #f3f4f6;
            border-radius: 7px;
        }

        .info-row span:last-child {
            font-weight: bold;
            color: #2563eb;
        }

        .notification {
            position: fixed;
            right: 25px;
            bottom: 25px;
            background: #111827;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            transform: translateY(100px);
            opacity: 0;
            transition: 0.3s;
            z-index: 100;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        .dark {
            background: #111827;
            color: #f9fafb;
        }

        .dark .card,
        .dark .stat,
        .dark .event {
            background: #1f2937;
            color: white;
            border-color: #374151;
        }

        .dark input,
        .dark select,
        .dark textarea {
            background: #111827;
            color: white;
            border-color: #4b5563;
        }

        .dark .info-row {
            background: #374151;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: repeat(2, 1fr);
            }

            .layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <header>
        <div>
            <h1>Event Management Dashboard</h1>
            <p>Interactive JavaScript Event System</p>
        </div>

        <div class="status">
            <div class="status-dot"></div>
            Event System Active
        </div>
    </header>

    <main>

        <section class="dashboard">

            <div class="stat">
                <span>Total Events</span>
                <strong id="totalEvents">0</strong>
            </div>

            <div class="stat">
                <span>Technology</span>
                <strong id="techEvents">0</strong>
            </div>

            <div class="stat">
                <span>Music</span>
                <strong id="musicEvents">0</strong>
            </div>

            <div class="stat">
                <span>Business</span>
                <strong id="businessEvents">0</strong>
            </div>

        </section>

        <div class="layout">

            <div>

                <section class="card">

                    <h2>Create Event</h2>

                    <form id="eventForm">

                        <div class="form-grid">

                            <div class="field">
                                <label for="eventName">
                                    Event Name
                                </label>

                                <input
                                    type="text"
                                    id="eventName"
                                    placeholder="Enter event name"
                                    required
                                >
                            </div>

                            <div class="field">

                                <label for="eventCategory">
                                    Category
                                </label>

                                <select id="eventCategory" required>

                                    <option value="">
                                        Select category
                                    </option>

                                    <option value="Technology">
                                        Technology
                                    </option>

                                    <option value="Music">
                                        Music
                                    </option>

                                    <option value="Business">
                                        Business
                                    </option>

                                </select>

                            </div>

                            <div class="field">

                                <label for="eventDate">
                                    Date
                                </label>

                                <input
                                    type="date"
                                    id="eventDate"
                                    required
                                >

                            </div>

                            <div class="field">

                                <label for="eventLocation">
                                    Location
                                </label>

                                <input
                                    type="text"
                                    id="eventLocation"
                                    placeholder="Event location"
                                    required
                                >

                            </div>

                            <div class="field full">

                                <label for="eventDescription">
                                    Description
                                </label>

                                <textarea
                                    id="eventDescription"
                                    placeholder="Describe your event..."
                                    required
                                ></textarea>

                            </div>

                        </div>

                        <div class="form-actions">

                            <button
                                type="submit"
                                class="primary"
                            >
                                Create Event
                            </button>

                            <button
                                type="reset"
                                class="secondary"
                            >
                                Reset
                            </button>

                        </div>

                    </form>

                </section>


                <section class="card">

                    <h2>Events</h2>

                    <div class="event-list" id="eventList"></div>

                </section>

            </div>


            <aside>

                <section class="card">

                    <h2>Event Inspector</h2>

                    <div class="event-info">

                        <div class="info-row">
                            <span>Event Type</span>
                            <span id="eventType">None</span>
                        </div>

                        <div class="info-row">
                            <span>Target</span>
                            <span id="eventTarget">None</span>
                        </div>

                        <div class="info-row">
                            <span>Key</span>
                            <span id="eventKey">None</span>
                        </div>

                        <div class="info-row">
                            <span>Events Fired</span>
                            <span id="eventCount">0</span>
                        </div>

                    </div>

                </section>


                <section class="card">

                    <h2>Event Controls</h2>

                    <button
                        id="themeBtn"
                        class="primary"
                    >
                        Toggle Dark Mode
                    </button>

                    <button
                        id="disableBtn"
                        class="danger"
                    >
                        Disable Event Creation
                    </button>

                    <button
                        id="clearLogBtn"
                        class="secondary"
                    >
                        Clear Event Log
                    </button>

                </section>


                <section class="card">

                    <h2>Event Log</h2>

                    <div
                        class="log"
                        id="eventLog"
                    ></div>

                </section>

            </aside>

        </div>

    </main>

    <div
        id="notification"
        class="notification"
    ></div>


    <script>

        const eventForm =
            document.getElementById("eventForm");

        const eventList =
            document.getElementById("eventList");

        const eventName =
            document.getElementById("eventName");

        const eventCategory =
            document.getElementById("eventCategory");

        const eventDate =
            document.getElementById("eventDate");

        const eventLocation =
            document.getElementById("eventLocation");

        const eventDescription =
            document.getElementById("eventDescription");

        const themeBtn =
            document.getElementById("themeBtn");

        const disableBtn =
            document.getElementById("disableBtn");

        const clearLogBtn =
            document.getElementById("clearLogBtn");

        const eventType =
            document.getElementById("eventType");

        const eventTarget =
            document.getElementById("eventTarget");

        const eventKey =
            document.getElementById("eventKey");

        const eventCount =
            document.getElementById("eventCount");

        const eventLog =
            document.getElementById("eventLog");

        const notification =
            document.getElementById("notification");

        const totalEvents =
            document.getElementById("totalEvents");

        const techEvents =
            document.getElementById("techEvents");

        const musicEvents =
            document.getElementById("musicEvents");

        const businessEvents =
            document.getElementById("businessEvents");


        let events = [
            {
                id: 1,
                name: "JavaScript Developer Conference",
                category: "Technology",
                date: "2026-10-15",
                location: "Nairobi",
                description: "A conference for modern JavaScript developers."
            },
            {
                id: 2,
                name: "Live Music Festival",
                category: "Music",
                date: "2026-11-02",
                location: "Nairobi",
                description: "A weekend of live performances and entertainment."
            },
            {
                id: 3,
                name: "Business Growth Summit",
                category: "Business",
                date: "2026-11-20",
                location: "Mombasa",
                description: "Learn strategies for building and scaling businesses."
            }
        ];


        let firedEvents = 0;

        let creationEnabled = true;


        function updateEventInspector(
            event,
            key = "None"
        ) {

            firedEvents++;

            eventType.textContent =
                event.type;

            eventTarget.textContent =
                event.target.id ||
                event.target.tagName;

            eventKey.textContent =
                key;

            eventCount.textContent =
                firedEvents;

            const time =
                new Date().toLocaleTimeString();

            const entry =
                document.createElement("div");

            entry.className =
                "log-entry";

            entry.innerHTML =
                `<span>${time}</span> — ${event.type} → ${event.target.id || event.target.tagName}`;

            eventLog.prepend(entry);
        }


        function showNotification(message) {

            notification.textContent =
                message;

            notification.classList.add(
                "show"
            );

            setTimeout(() => {

                notification.classList.remove(
                    "show"
                );

            }, 2500);
        }


        function updateStatistics() {

            totalEvents.textContent =
                events.length;

            techEvents.textContent =
                events.filter(
                    event =>
                        event.category === "Technology"
                ).length;

            musicEvents.textContent =
                events.filter(
                    event =>
                        event.category === "Music"
                ).length;

            businessEvents.textContent =
                events.filter(
                    event =>
                        event.category === "Business"
                ).length;
        }


        function renderEvents() {

            eventList.innerHTML = "";

            if (events.length === 0) {

                eventList.innerHTML =
                    `<div class="empty">
                        No events available.
                    </div>`;

                updateStatistics();

                return;
            }


            events.forEach(event => {

                const article =
                    document.createElement("article");

                article.className =
                    "event";

                article.dataset.id =
                    event.id;

                const categoryClass =
                    event.category.toLowerCase();

                article.innerHTML = `
                    <div class="event-top">

                        <div>
                            <h3>${event.name}</h3>

                            <p>
                                📅 ${event.date}
                            </p>

                            <p>
                                📍 ${event.location}
                            </p>
                        </div>

                        <span class="badge ${categoryClass}">
                            ${event.category}
                        </span>

                    </div>

                    <p>
                        ${event.description}
                    </p>

                    <div class="event-actions">

                        <button
                            class="success register-btn"
                            data-id="${event.id}"
                        >
                            Register
                        </button>

                        <button
                            class="danger delete-btn"
                            data-id="${event.id}"
                        >
                            Delete
                        </button>

                    </div>
                `;

                eventList.appendChild(article);
            });


            updateStatistics();
        }


        function createEvent(event) {

            event.preventDefault();

            if (!creationEnabled) {

                showNotification(
                    "Event creation is disabled."
                );

                return;
            }


            const newEvent = {

                id: Date.now(),

                name: eventName.value,

                category: eventCategory.value,

                date: eventDate.value,

                location: eventLocation.value,

                description: eventDescription.value
            };


            events.push(newEvent);

            renderEvents();

            eventForm.reset();

            showNotification(
                "Event created successfully!"
            );

            updateEventInspector(event);
        }


        eventForm.addEventListener(
            "submit",
            createEvent
        );


        eventForm.addEventListener(
            "reset",
            event => {

                updateEventInspector(event);

                showNotification(
                    "Form has been reset."
                );
            }
        );


        eventList.addEventListener(
            "click",
            event => {

                updateEventInspector(event);

                const registerButton =
                    event.target.closest(
                        ".register-btn"
                    );

                const deleteButton =
                    event.target.closest(
                        ".delete-btn"
                    );


                if (registerButton) {

                    const id =
                        Number(
                            registerButton.dataset.id
                        );

                    const selectedEvent =
                        events.find(
                            item =>
                                item.id === id
                        );

                    showNotification(
                        `Registered for ${selectedEvent.name}`
                    );

                    return;
                }


                if (deleteButton) {

                    const id =
                        Number(
                            deleteButton.dataset.id
                        );

                    events =
                        events.filter(
                            item =>
                                item.id !== id
                        );

                    renderEvents();

                    showNotification(
                        "Event deleted."
                    );
                }

            }
        );


        eventList.addEventListener(
            "mouseover",
            event => {

                const card =
                    event.target.closest(
                        ".event"
                    );

                if (!card) {
                    return;
                }

                card.style.transform =
                    "scale(1.01)";

                updateEventInspector(event);
            }
        );


        eventList.addEventListener(
            "mouseout",
            event => {

                const card =
                    event.target.closest(
                        ".event"
                    );

                if (!card) {
                    return;
                }

                card.style.transform =
                    "scale(1)";
            }
        );


        eventName.addEventListener(
            "input",
            event => {

                updateEventInspector(event);

                if (
                    eventName.value.length > 40
                ) {

                    eventName.value =
                        eventName.value.substring(
                            0,
                            40
                        );
                }
            }
        );


        eventCategory.addEventListener(
            "change",
            event => {

                updateEventInspector(event);

                showNotification(
                    `Category selected: ${event.target.value}`
                );
            }
        );


        document.addEventListener(
            "keydown",
            event => {

                updateEventInspector(
                    event,
                    event.key
                );

                if (
                    event.key === "Escape"
                ) {

                    showNotification(
                        "Escape key detected."
                    );
                }

                if (
                    event.ctrlKey &&
                    event.key.toLowerCase() === "k"
                ) {

                    event.preventDefault();

                    eventName.focus();

                    showNotification(
                        "Event name field focused."
                    );
                }
            }
        );


        themeBtn.addEventListener(
            "click",
            event => {

                document.body.classList.toggle(
                    "dark"
                );

                updateEventInspector(event);

                showNotification(
                    "Theme changed."
                );
            }
        );


        function disableEventCreation(event) {

            creationEnabled =
                false;

            eventForm.removeEventListener(
                "submit",
                createEvent
            );

            disableBtn.textContent =
                "Event Creation Disabled";

            disableBtn.disabled =
                true;

            updateEventInspector(event);

            showNotification(
                "Event creation listener removed."
            );
        }


        disableBtn.addEventListener(
            "click",
            disableEventCreation
        );


        clearLogBtn.addEventListener(
            "click",
            event => {

                eventLog.innerHTML = "";

                updateEventInspector(event);

                showNotification(
                    "Event log cleared."
                );
            }
        );


        eventList.addEventListener(
            "dblclick",
            event => {

                const card =
                    event.target.closest(
                        ".event"
                    );

                if (!card) {
                    return;
                }

                card.style.background =
                    "#dbeafe";

                updateEventInspector(event);

                showNotification(
                    "Event selected with double-click."
                );
            }
        );


        renderEvents();

    </script>

</body>
</html>
```
