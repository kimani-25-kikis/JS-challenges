<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitTrack Pro — Workout Tracker</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #334155;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #22d3ee;
    --accent-dark: #0891b2;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --purple: #a78bfa;
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 60px;
  }

  .container {
    width: min(1200px, 94%);
    margin: auto;
  }

  header {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border-bottom: 1px solid var(--border);
    padding: 22px 0;
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(10px);
  }

  .header-content {
    display: flex; justify-content: space-between;
    align-items: center; gap: 20px; flex-wrap: wrap;
  }

  .logo { display: flex; align-items: center; gap: 12px; }

  .logo-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    display: grid; place-items: center; font-size: 22px;
  }

  .logo h1 { font-size: 22px; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }

  .add-btn {
    background: var(--accent); color: #0f172a;
    border: none; padding: 12px 20px; border-radius: 10px;
    font-weight: 700; cursor: pointer; font-size: 15px;
    transition: 0.2s;
  }

  .add-btn:hover { background: var(--accent-dark); color: white; }

  .hero {
    padding: 40px 0 30px;
    display: flex; justify-content: space-between;
    align-items: center; gap: 20px; flex-wrap: wrap;
  }

  .hero h2 { font-size: 32px; margin-bottom: 6px; }
  .hero p { color: var(--muted); }

  .streak-badge {
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    padding: 14px 22px; border-radius: 14px;
    font-weight: 700; display: flex; align-items: center; gap: 10px;
    font-size: 15px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px; margin-bottom: 30px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 22px; border-radius: 16px;
    transition: 0.2s;
  }

  .stat-card:hover { transform: translateY(-3px); border-color: var(--accent); }

  .stat-icon {
    width: 42px; height: 42px; border-radius: 10px;
    display: grid; place-items: center; font-size: 20px;
    margin-bottom: 14px;
  }

  .stat-card p { color: var(--muted); font-size: 13px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-card h3 { font-size: 28px; font-weight: 700; }
  .stat-card h3 small { font-size: 14px; color: var(--muted); font-weight: normal; margin-left: 4px; }

  .dashboard-row {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 20px; margin-bottom: 30px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 24px;
  }

  .card h3 { font-size: 16px; margin-bottom: 18px; color: var(--text); }

  .goal-ring-wrap {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
  }

  .goal-ring-wrap svg { transform: rotate(-90deg); }

  .ring-bg { stroke: var(--surface-2); }
  .ring-fg {
    stroke: url(#gradient);
    stroke-linecap: round;
    transition: stroke-dashoffset 1s ease;
  }

  .ring-label {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .ring-label .num { font-size: 34px; font-weight: 800; }
  .ring-label .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .chart-wrap {
    position: relative; height: 240px;
  }

  #weekChart { width: 100%; height: 100%; }

  .heatmap-card { margin-bottom: 30px; overflow-x: auto; }

  .heatmap {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(7, 14px);
    gap: 4px;
    min-width: max-content;
  }

  .day-cell {
    width: 14px; height: 14px;
    border-radius: 3px;
    background: var(--surface-2);
    transition: 0.2s;
    cursor: pointer;
  }

  .day-cell:hover { transform: scale(1.4); }

  .day-cell[data-level="1"] { background: #164e63; }
  .day-cell[data-level="2"] { background: #0e7490; }
  .day-cell[data-level="3"] { background: #06b6d4; }
  .day-cell[data-level="4"] { background: #22d3ee; }

  .heatmap-legend {
    display: flex; align-items: center; gap: 6px;
    margin-top: 14px; font-size: 12px; color: var(--muted);
  }

  .list-header {
    display: flex; justify-content: space-between;
    align-items: center; gap: 15px; margin-bottom: 18px;
    flex-wrap: wrap;
  }

  .list-header h3 { font-size: 20px; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; }

  .filter-chip {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 8px 14px; border-radius: 20px;
    cursor: pointer; font-size: 13px; transition: 0.2s;
  }

  .filter-chip.active,
  .filter-chip:hover {
    background: var(--accent); color: #0f172a;
    border-color: var(--accent);
  }

  .workout-list { display: grid; gap: 12px; }

  .workout-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px; padding: 18px;
    display: flex; justify-content: space-between;
    align-items: center; gap: 16px;
    animation: slideIn 0.3s ease;
    transition: 0.2s;
  }

  .workout-item:hover { border-color: var(--accent); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .workout-left {
    display: flex; align-items: center; gap: 14px; flex: 1;
  }

  .workout-emoji {
    width: 46px; height: 46px; border-radius: 12px;
    display: grid; place-items: center; font-size: 22px;
    background: var(--surface-2); flex-shrink: 0;
  }

  .workout-info h4 { font-size: 16px; margin-bottom: 4px; }
  .workout-info p { color: var(--muted); font-size: 13px; }

  .workout-stats {
    display: flex; gap: 20px; text-align: right;
  }

  .workout-stats div p {
    color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .workout-stats div strong { font-size: 16px; }

  .delete-workout {
    background: rgba(239, 68, 68, 0.15);
    color: var(--danger);
    border: none; padding: 8px 10px;
    border-radius: 8px; cursor: pointer;
    font-size: 16px; transition: 0.2s;
  }

  .delete-workout:hover { background: var(--danger); color: white; }

  .empty {
    text-align: center; padding: 60px 20px;
    background: var(--surface); border-radius: 16px;
    border: 1px dashed var(--border);
  }

  .empty .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.6; }
  .empty h3 { margin-bottom: 6px; }
  .empty p { color: var(--muted); }

  .modal {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.7);
    display: none; place-items: center;
    padding: 20px; z-index: 100;
    backdrop-filter: blur(4px);
  }

  .modal.show { display: grid; animation: fadeIn 0.2s ease; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-box {
    width: min(520px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
    animation: popIn 0.3s ease;
  }

  @keyframes popIn {
    from { transform: scale(0.95); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-head {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 22px;
  }

  .modal-head h3 { font-size: 20px; }

  .close-x {
    background: none; border: none;
    color: var(--muted); font-size: 26px;
    cursor: pointer; line-height: 1;
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block; margin-bottom: 7px;
    font-size: 13px; font-weight: 600;
    color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .field input,
  .field select {
    width: 100%; padding: 12px 14px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px; font-size: 15px; outline: none;
    transition: 0.2s;
  }

  .field input:focus,
  .field select:focus { border-color: var(--accent); }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .submit {
    width: 100%; padding: 14px;
    background: var(--accent); color: #0f172a;
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700;
    cursor: pointer; transition: 0.2s; margin-top: 8px;
  }

  .submit:hover { background: var(--accent-dark); color: white; }

  @media (max-width: 900px) {
    .dashboard-row { grid-template-columns: 1fr; }
  }

  @media (max-width: 600px) {
    .hero h2 { font-size: 24px; }
    .workout-item { flex-direction: column; align-items: flex-start; }
    .workout-stats { width: 100%; justify-content: space-between; }
    .field-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="container header-content">
    <div class="logo">
      <div class="logo-icon">💪</div>
      <div>
        <h1>FitTrack <span>Pro</span></h1>
      </div>
    </div>
    <button class="add-btn" id="openModal">+ Log Workout</button>
  </div>
</header>

<div class="container">

  <section class="hero">
    <div>
      <h2>Welcome back, Athlete 👋</h2>
      <p id="todayText">Loading...</p>
    </div>
    <div class="streak-badge">
      🔥 <span id="streakCount">0</span> day streak
    </div>
  </section>

  <section class="stats">
    <div class="stat-card">
      <div class="stat-icon" style="background: rgba(34, 211, 238, 0.15); color: #22d3ee;">🏋️</div>
      <p>Total Workouts</p>
      <h3 id="statTotal">0</h3>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background: rgba(167, 139, 250, 0.15); color: #a78bfa;">⏱️</div>
      <p>Total Minutes</p>
      <h3 id="statMinutes">0</h3>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background: rgba(245, 158, 11, 0.15); color: #f59e0b;">🔥</div>
      <p>Calories Burned</p>
      <h3 id="statCalories">0</h3>
    </div>
    <div class="stat-card">
      <div class="stat-icon" style="background: rgba(34, 197, 94, 0.15); color: #22c55e;">📅</div>
      <p>This Week</p>
      <h3 id="statWeek">0<small>sessions</small></h3>
    </div>
  </section>

  <section class="dashboard-row">

    <div class="card goal-ring-wrap">
      <h3 style="align-self: flex-start;">Weekly Goal</h3>
      <svg width="180" height="180" viewBox="0 0 180 180">
        <defs>
          <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22d3ee"/>
            <stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="90" cy="90" r="75" fill="none" stroke-width="14"/>
        <circle class="ring-fg" id="goalRing" cx="90" cy="90" r="75" fill="none" stroke-width="14"
                stroke-dasharray="471" stroke-dashoffset="471"/>
      </svg>
      <div class="ring-label">
        <div class="num" id="goalPercent">0%</div>
        <div class="sub" id="goalSub">0 / 5 workouts</div>
      </div>
    </div>

    <div class="card">
      <h3>Last 7 Days (Minutes)</h3>
      <div class="chart-wrap">
        <canvas id="weekChart"></canvas>
      </div>
    </div>

  </section>

  <section class="card heatmap-card">
    <h3>Activity — Last 12 Weeks</h3>
    <div class="heatmap" id="heatmap"></div>
    <div class="heatmap-legend">
      <span>Less</span>
      <div class="day-cell"></div>
      <div class="day-cell" data-level="1"></div>
      <div class="day-cell" data-level="2"></div>
      <div class="day-cell" data-level="3"></div>
      <div class="day-cell" data-level="4"></div>
      <span>More</span>
    </div>
  </section>

  <section>
    <div class="list-header">
      <h3>Recent Workouts</h3>
      <div class="filters" id="filters">
        <button class="filter-chip active" data-type="all">All</button>
        <button class="filter-chip" data-type="Cardio">🏃 Cardio</button>
        <button class="filter-chip" data-type="Strength">🏋️ Strength</button>
        <button class="filter-chip" data-type="Yoga">🧘 Yoga</button>
        <button class="filter-chip" data-type="Cycling">🚴 Cycling</button>
        <button class="filter-chip" data-type="Swimming">🏊 Swimming</button>
      </div>
    </div>

    <div class="workout-list" id="workoutList"></div>
  </section>

</div>

<div class="modal" id="workoutModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Log New Workout</h3>
      <button class="close-x" id="closeModal">&times;</button>
    </div>

    <form id="workoutForm">
      <div class="field">
        <label for="wType">Workout Type</label>
        <select id="wType" required>
          <option value="Cardio">🏃 Cardio</option>
          <option value="Strength">🏋️ Strength</option>
          <option value="Yoga">🧘 Yoga</option>
          <option value="Cycling">🚴 Cycling</option>
          <option value="Swimming">🏊 Swimming</option>
        </select>
      </div>

      <div class="field">
        <label for="wName">Workout Name</label>
        <input type="text" id="wName" placeholder="e.g. Morning Run" required>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="wDuration">Duration (min)</label>
          <input type="number" id="wDuration" min="1" placeholder="30" required>
        </div>
        <div class="field">
          <label for="wCalories">Calories</label>
          <input type="number" id="wCalories" min="0" placeholder="250" required>
        </div>
      </div>

      <div class="field">
        <label for="wDate">Date</label>
        <input type="date" id="wDate" required>
      </div>

      <button class="submit" type="submit">Save Workout</button>
    </form>
  </div>
</div>

<script>

class Workout {
  constructor({ id, type, name, duration, calories, date }) {
    this.id       = id ?? Date.now() + Math.random();
    this.type     = type;
    this.name     = name;
    this.duration = Number(duration);
    this.calories = Number(calories);
    this.date     = new Date(date);
  }

  get emoji() {
    return {
      Cardio:   "🏃",
      Strength: "🏋️",
      Yoga:     "🧘",
      Cycling:  "🚴",
      Swimming: "🏊"
    }[this.type] || "💪";
  }

  get formattedDate() {
    return this.date.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    });
  }

  get isoDate() {
    return this.date.toISOString().slice(0, 10);
  }
}

const STORAGE_KEY = "fittrack_pro_workouts";
const WEEKLY_GOAL = 5;

let workouts = [];
let activeFilter = "all";

function saveWorkouts() {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(workouts.map(w => ({
      id: w.id, type: w.type, name: w.name,
      duration: w.duration, calories: w.calories,
      date: w.isoDate
    })))
  );
}

function loadWorkouts() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) return seedDemoData();
  try {
    const parsed = JSON.parse(raw);
    workouts = parsed.map(w => new Workout(w));
  } catch {
    seedDemoData();
  }
}

function seedDemoData() {
  const today = new Date();
  const daysAgo = n => {
    const d = new Date(today);
    d.setDate(d.getDate() - n);
    return d;
  };

  workouts = [
    new Workout({ type: "Cardio",   name: "Morning Run",   duration: 32, calories: 320, date: daysAgo(0) }),
    new Workout({ type: "Strength", name: "Upper Body",    duration: 45, calories: 280, date: daysAgo(1) }),
    new Workout({ type: "Yoga",     name: "Evening Flow",  duration: 25, calories: 120, date: daysAgo(2) }),
    new Workout({ type: "Cycling",  name: "Hill Ride",     duration: 60, calories: 550, date: daysAgo(3) }),
    new Workout({ type: "Cardio",   name: "HIIT Session",  duration: 20, calories: 260, date: daysAgo(5) }),
    new Workout({ type: "Strength", name: "Leg Day",       duration: 50, calories: 340, date: daysAgo(7) }),
    new Workout({ type: "Swimming", name: "Pool Laps",     duration: 40, calories: 400, date: daysAgo(9) }),
    new Workout({ type: "Cardio",   name: "Treadmill Run", duration: 28, calories: 290, date: daysAgo(12) })
  ];
  saveWorkouts();
}

function renderWorkouts() {
  const list = document.getElementById("workoutList");

  const visible = workouts
    .filter(w => activeFilter === "all" || w.type === activeFilter)
    .sort((a, b) => b.date - a.date);

  if (visible.length === 0) {
    list.innerHTML = `
      <div class="empty">
        <div class="icon">🏃‍♂️</div>
        <h3>No workouts logged yet</h3>
        <p>Click "+ Log Workout" to start tracking your fitness.</p>
      </div>
    `;
    return;
  }

  list.innerHTML = visible.map(w => `
    <div class="workout-item">
      <div class="workout-left">
        <div class="workout-emoji">${w.emoji}</div>
        <div class="workout-info">
          <h4>${w.name}</h4>
          <p>${w.type} • ${w.formattedDate}</p>
        </div>
      </div>

      <div class="workout-stats">
        <div>
          <p>Duration</p>
          <strong>${w.duration} min</strong>
        </div>
        <div>
          <p>Calories</p>
          <strong>${w.calories}</strong>
        </div>
      </div>

      <button class="delete-workout" data-id="${w.id}" title="Delete">🗑</button>
    </div>
  `).join("");
}

function renderStats() {
  const total    = workouts.length;
  const minutes  = workouts.reduce((s, w) => s + w.duration, 0);
  const calories = workouts.reduce((s, w) => s + w.calories, 0);

  const now       = new Date();
  const weekStart = startOfWeek(now);

  const thisWeek  = workouts.filter(w => w.date >= weekStart).length;

  document.getElementById("statTotal").textContent    = total;
  document.getElementById("statMinutes").textContent  = minutes.toLocaleString();
  document.getElementById("statCalories").textContent = calories.toLocaleString();
  document.getElementById("statWeek").innerHTML       = `${thisWeek}<small>sessions</small>`;

  const circumference = 471;
  const percent       = Math.min(thisWeek / WEEKLY_GOAL, 1);
  const offset        = circumference - (percent * circumference);

  document.getElementById("goalRing").style.strokeDashoffset = offset;
  document.getElementById("goalPercent").textContent = Math.round(percent * 100) + "%";
  document.getElementById("goalSub").textContent = `${thisWeek} / ${WEEKLY_GOAL} workouts`;

  document.getElementById("streakCount").textContent = calculateStreak();
}

function startOfWeek(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function calculateStreak() {
  if (workouts.length === 0) return 0;

  const days = new Set(workouts.map(w => w.isoDate));
  let streak = 0;
  const cursor = new Date();
  cursor.setHours(0, 0, 0, 0);

  while (days.has(cursor.toISOString().slice(0, 10))) {
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function drawWeekChart() {
  const canvas = document.getElementById("weekChart");
  const ctx    = canvas.getContext("2d");

  const dpr    = window.devicePixelRatio || 1;
  const rect   = canvas.getBoundingClientRect();
  canvas.width  = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const W = rect.width;
  const H = rect.height;
  const padding = { top: 20, right: 16, bottom: 34, left: 36 };

  const chartW = W - padding.left - padding.right;
  const chartH = H - padding.top - padding.bottom;

  ctx.clearRect(0, 0, W, H);

  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    d.setHours(0, 0, 0, 0);
    const iso = d.toISOString().slice(0, 10);

    const minutes = workouts
      .filter(w => w.isoDate === iso)
      .reduce((s, w) => s + w.duration, 0);

    days.push({
      label: d.toLocaleDateString("en-US", { weekday: "short" }),
      minutes
    });
  }

  const max = Math.max(...days.map(d => d.minutes), 30);
  const barW = chartW / days.length;
  const pad  = barW * 0.25;

  ctx.strokeStyle = "rgba(148, 163, 184, 0.15)";
  ctx.lineWidth = 1;
  ctx.font = "11px system-ui";
  ctx.fillStyle = "#94a3b8";
  ctx.textAlign = "right";

  for (let i = 0; i <= 4; i++) {
    const y = padding.top + (chartH / 4) * i;
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(W - padding.right, y);
    ctx.stroke();

    const value = Math.round(max - (max / 4) * i);
    ctx.fillText(value, padding.left - 8, y + 4);
  }

  days.forEach((day, i) => {
    const barH = (day.minutes / max) * chartH;
    const x    = padding.left + i * barW + pad;
    const y    = padding.top + chartH - barH;
    const w    = barW - pad * 2;

    const grad = ctx.createLinearGradient(0, y, 0, y + barH);
    grad.addColorStop(0, "#22d3ee");
    grad.addColorStop(1, "#0e7490");

    ctx.fillStyle = day.minutes > 0 ? grad : "rgba(51, 65, 85, 0.5)";

    const radius = Math.min(w / 2, barH / 2, 6);
    ctx.beginPath();
    ctx.moveTo(x, y + barH);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + barH);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#94a3b8";
    ctx.font = "11px system-ui";
    ctx.textAlign = "center";
    ctx.fillText(day.label, x + w / 2, H - 12);
  });
}

function renderHeatmap() {
  const container = document.getElementById("heatmap");
  container.innerHTML = "";

  const countMap = {};
  workouts.forEach(w => {
    countMap[w.isoDate] = (countMap[w.isoDate] || 0) + w.duration;
  });

  const totalDays = 84;
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const cells = [];
  for (let i = totalDays - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const iso = d.toISOString().slice(0, 10);
    const minutes = countMap[iso] || 0;

    let level = 0;
    if (minutes > 0)   level = 1;
    if (minutes >= 30) level = 2;
    if (minutes >= 60) level = 3;
    if (minutes >= 90) level = 4;

    cells.push({ iso, level, minutes, date: d });
  }

  cells.forEach(cell => {
    const div = document.createElement("div");
    div.className = "day-cell";
    if (cell.level > 0) div.dataset.level = cell.level;
    div.title = `${cell.date.toLocaleDateString()} — ${cell.minutes} min`;
    container.appendChild(div);
  });
}

const modal = document.getElementById("workoutModal");

function openModal() {
  document.getElementById("wDate").value = new Date().toISOString().slice(0, 10);
  modal.classList.add("show");
}

function closeModal() {
  modal.classList.remove("show");
  document.getElementById("workoutForm").reset();
}

document.getElementById("openModal").addEventListener("click", openModal);
document.getElementById("closeModal").addEventListener("click", closeModal);
modal.addEventListener("click", e => {
  if (e.target === modal) closeModal();
});

document.getElementById("workoutForm").addEventListener("submit", e => {
  e.preventDefault();

  const workout = new Workout({
    type:     document.getElementById("wType").value,
    name:     document.getElementById("wName").value.trim(),
    duration: document.getElementById("wDuration").value,
    calories: document.getElementById("wCalories").value,
    date:     document.getElementById("wDate").value
  });

  workouts.push(workout);
  saveWorkouts();
  refreshAll();
  closeModal();
});

document.getElementById("workoutList").addEventListener("click", e => {
  const btn = e.target.closest(".delete-workout");
  if (!btn) return;

  const id = btn.dataset.id;
  const workout = workouts.find(w => String(w.id) === id);
  if (!workout) return;

  if (confirm(`Delete "${workout.name}"?`)) {
    workouts = workouts.filter(w => String(w.id) !== id);
    saveWorkouts();
    refreshAll();
  }
});

document.getElementById("filters").addEventListener("click", e => {
  const chip = e.target.closest(".filter-chip");
  if (!chip) return;

  document.querySelectorAll(".filter-chip")
    .forEach(c => c.classList.remove("active"));
  chip.classList.add("active");

  activeFilter = chip.dataset.type;
  renderWorkouts();
});

function renderToday() {
  document.getElementById("todayText").textContent =
    new Date().toLocaleDateString("en-US", {
      weekday: "long", year: "numeric",
      month: "long", day: "numeric"
    });
}

function refreshAll() {
  renderWorkouts();
  renderStats();
  drawWeekChart();
  renderHeatmap();
}

loadWorkouts();
renderToday();
refreshAll();

window.addEventListener("resize", drawWeekChart);

</script>
