<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EventHub - Event Ticket Booking</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #1f2937;
      min-height: 100vh;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 5%;
    }

    .header-content {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .logo span {
      color: #60a5fa;
    }

    .cart-button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .hero {
      background: #1e3a8a;
      color: white;
      padding: 60px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #dbeafe;
      font-size: 17px;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: 30px auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .stat-card h3 {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 10px;
    }

    .stat-card p {
      font-size: 28px;
      font-weight: bold;
    }

    .controls {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 30px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .controls h2 {
      margin-bottom: 15px;
    }

    .control-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 12px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      outline: none;
      font-size: 14px;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    .section-title {
      margin-bottom: 18px;
    }

    .events {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .event-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s;
    }

    .event-card:hover {
      transform: translateY(-4px);
    }

    .event-image {
      height: 160px;
      background: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 45px;
    }

    .event-content {
      padding: 20px;
    }

    .event-content h3 {
      margin-bottom: 10px;
      font-size: 20px;
    }

    .category {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .event-info {
      color: #64748b;
      line-height: 1.8;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .book-button {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    .book-button:hover {
      background: #1d4ed8;
    }

    .book-button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .bookings {
      margin-top: 50px;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    }

    .booking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 18px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .booking-item:last-child {
      border-bottom: none;
    }

    .booking-info h3 {
      margin-bottom: 6px;
    }

    .booking-info p {
      color: #64748b;
      font-size: 14px;
    }

    .booking-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-button {
      width: 32px;
      height: 32px;
      border: none;
      background: #e2e8f0;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .remove-button {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }

    .booking-total {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }

    footer {
      margin-top: 60px;
      background: #111827;
      color: #cbd5e1;
      text-align: center;
      padding: 25px;
    }

    @media (max-width: 900px) {
      .events {
        grid-template-columns: repeat(2, 1fr);
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .control-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      .events,
      .stats,
      .control-grid {
        grid-template-columns: 1fr;
      }

      .header-content {
        flex-direction: column;
      }

      .hero h1 {
        font-size: 32px;
      }

      .booking-item {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="header-content">
      <div class="logo">
        Event<span>Hub</span>
      </div>

      <button class="cart-button" onclick="scrollToBookings()">
        🎟️ My Bookings
        (<span id="bookingCount">0</span>)
      </button>
    </div>
  </header>


  <section class="hero">
    <h1>Find Your Next Experience</h1>
    <p>
      Discover events, book tickets and manage your bookings.
    </p>
  </section>


  <main class="container">

    <section class="stats">

      <div class="stat-card">
        <h3>Available Events</h3>
        <p id="eventCount">0</p>
      </div>

      <div class="stat-card">
        <h3>Booked Events</h3>
        <p id="bookedEvents">0</p>
      </div>

      <div class="stat-card">
        <h3>Total Tickets</h3>
        <p id="totalTickets">0</p>
      </div>

      <div class="stat-card">
        <h3>Total Spent</h3>
        <p id="totalSpent">KSh 0</p>
      </div>

    </section>


    <section class="controls">

      <h2>Find Events</h2>

      <div class="control-grid">

        <input
          type="text"
          id="searchInput"
          placeholder="Search events..."
        >

        <select id="categoryFilter">
          <option value="all">All Categories</option>
        </select>

        <select id="locationFilter">
          <option value="all">All Locations</option>
        </select>

        <select id="sortSelect">
          <option value="default">Sort By</option>
          <option value="priceLow">Price: Low → High</option>
          <option value="priceHigh">Price: High → Low</option>
          <option value="rating">Highest Rated</option>
          <option value="date">Date</option>
          <option value="name">Name</option>
        </select>

      </div>

    </section>


    <h2 class="section-title">
      Available Events
    </h2>

    <section id="eventsContainer" class="events"></section>


    <section id="bookingsSection" class="bookings">

      <h2>🎟️ My Bookings</h2>

      <div id="bookingsContainer"></div>

      <div class="booking-total">
        <span>Total</span>
        <span id="bookingTotal">KSh 0</span>
      </div>

    </section>

  </main>


  <footer>
    <p>EventHub © 2026 | Built with HTML, CSS & JavaScript</p>
  </footer>


  <script>

    const events = [

      {
        id: 1,
        title: "Nairobi Tech Summit",
        category: "Technology",
        location: "Nairobi",
        date: "2026-10-15",
        price: 2500,
        seats: 120,
        rating: 4.8,
        icon: "💻"
      },

      {
        id: 2,
        title: "Afrobeat Festival",
        category: "Music",
        location: "Nairobi",
        date: "2026-11-02",
        price: 3500,
        seats: 500,
        rating: 4.7,
        icon: "🎵"
      },

      {
        id: 3,
        title: "Kenya Food Expo",
        category: "Food",
        location: "Mombasa",
        date: "2026-10-25",
        price: 1500,
        seats: 200,
        rating: 4.5,
        icon: "🍴"
      },

      {
        id: 4,
        title: "Startup Founders Meetup",
        category: "Business",
        location: "Nakuru",
        date: "2026-11-10",
        price: 1800,
        seats: 80,
        rating: 4.6,
        icon: "🚀"
      },

      {
        id: 5,
        title: "JavaScript Developers Conference",
        category: "Technology",
        location: "Nairobi",
        date: "2026-12-05",
        price: 3000,
        seats: 150,
        rating: 4.9,
        icon: "🟨"
      },

      {
        id: 6,
        title: "Live Comedy Night",
        category: "Entertainment",
        location: "Nairobi",
        date: "2026-10-30",
        price: 1200,
        seats: 300,
        rating: 4.4,
        icon: "😂"
      },

      {
        id: 7,
        title: "Photography Workshop",
        category: "Workshop",
        location: "Kisumu",
        date: "2026-11-18",
        price: 2000,
        seats: 50,
        rating: 4.7,
        icon: "📷"
      },

      {
        id: 8,
        title: "Business Leadership Forum",
        category: "Business",
        location: "Nairobi",
        date: "2026-12-12",
        price: 4500,
        seats: 100,
        rating: 4.8,
        icon: "📊"
      }

    ];


    let bookings = [];


    function filterEvents(events, condition) {

      return events.filter(condition);

    }


    function transformEvents(events, transformation) {

      return events.map(transformation);

    }


    function calculate(items, operation, initialValue) {

      return items.reduce(
        operation,
        initialValue
      );

    }


    function runOperation(data, operation) {

      return operation(data);

    }


    function createCategoryFilter(category) {

      return function(event) {

        return event.category === category;

      };

    }


    function initializeFilters() {

      const categories =
        transformEvents(
          events,
          event => event.category
        );

      const uniqueCategories =
        [...new Set(categories)];


      const categoryFilter =
        document.getElementById(
          "categoryFilter"
        );


      uniqueCategories.forEach(category => {

        const option =
          document.createElement("option");

        option.value = category;

        option.textContent = category;

        categoryFilter.appendChild(option);

      });


      const locations =
        transformEvents(
          events,
          event => event.location
        );


      const uniqueLocations =
        [...new Set(locations)];


      const locationFilter =
        document.getElementById(
          "locationFilter"
        );


      uniqueLocations.forEach(location => {

        const option =
          document.createElement("option");

        option.value = location;

        option.textContent = location;

        locationFilter.appendChild(option);

      });

    }


    function renderEvents() {

      const search =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase();


      const category =
        document.getElementById(
          "categoryFilter"
        ).value;


      const location =
        document.getElementById(
          "locationFilter"
        ).value;


      const sort =
        document.getElementById(
          "sortSelect"
        ).value;


      let displayedEvents =
        [...events];


      displayedEvents =
        filterEvents(
          displayedEvents,
          event =>
            event.title
              .toLowerCase()
              .includes(search)
        );


      if (category !== "all") {

        const categoryFilter =
          createCategoryFilter(category);

        displayedEvents =
          filterEvents(
            displayedEvents,
            categoryFilter
          );

      }


      if (location !== "all") {

        displayedEvents =
          filterEvents(
            displayedEvents,
            event =>
              event.location === location
          );

      }


      if (sort === "priceLow") {

        displayedEvents.sort(
          (a, b) => a.price - b.price
        );

      }


      if (sort === "priceHigh") {

        displayedEvents.sort(
          (a, b) => b.price - a.price
        );

      }


      if (sort === "rating") {

        displayedEvents.sort(
          (a, b) => b.rating - a.rating
        );

      }


      if (sort === "date") {

        displayedEvents.sort(
          (a, b) =>
            new Date(a.date) -
            new Date(b.date)
        );

      }


      if (sort === "name") {

        displayedEvents.sort(
          (a, b) =>
            a.title.localeCompare(b.title)
        );

      }


      const html =
        displayedEvents.map(event => {

          const booking =
            bookings.find(
              item =>
                item.eventId === event.id
            );


          const bookedQuantity =
            booking
              ? booking.quantity
              : 0;


          const remainingSeats =
            event.seats -
            bookedQuantity;


          return `

            <article class="event-card">

              <div class="event-image">
                ${event.icon}
              </div>

              <div class="event-content">

                <span class="category">
                  ${event.category}
                </span>

                <h3>
                  ${event.title}
                </h3>

                <div class="event-info">

                  📍 ${event.location}
                  <br>

                  📅 ${formatDate(event.date)}
                  <br>

                  ⭐ ${event.rating}
                  <br>

                  🎟️ ${remainingSeats} seats available

                </div>

                <div class="price">
                  KSh ${event.price.toLocaleString()}
                </div>

                <button
                  class="book-button"
                  onclick="bookTicket(${event.id})"
                  ${remainingSeats <= 0 ? "disabled" : ""}
                >

                  ${
                    remainingSeats <= 0
                      ? "Sold Out"
                      : "Book Ticket"
                  }

                </button>

              </div>

            </article>

          `;

        }).join("");


      const container =
        document.getElementById(
          "eventsContainer"
        );


      if (html === "") {

        container.innerHTML = `
          <div class="empty">
            <h3>No events found</h3>
            <p>
              Try changing your search or filters.
            </p>
          </div>
        `;

      } else {

        container.innerHTML = html;

      }

    }


    function bookTicket(eventId) {

      const event =
        events.find(
          event => event.id === eventId
        );


      if (!event) {
        return;
      }


      const existingBooking =
        bookings.find(
          booking =>
            booking.eventId === eventId
        );


      if (existingBooking) {

        existingBooking.quantity++;

      } else {

        bookings.push({

          id: Date.now(),

          eventId: event.id,

          title: event.title,

          price: event.price,

          quantity: 1

        });

      }


      renderEvents();

      renderBookings();

      updateStatistics();

    }


    function changeQuantity(
      bookingId,
      amount
    ) {

      const booking =
        bookings.find(
          booking =>
            booking.id === bookingId
        );


      if (!booking) {
        return;
      }


      booking.quantity += amount;


      if (booking.quantity <= 0) {

        bookings =
          bookings.filter(
            booking =>
              booking.id !== bookingId
          );

      }


      renderEvents();

      renderBookings();

      updateStatistics();

    }


    function removeBooking(bookingId) {

      bookings =
        bookings.filter(
          booking =>
            booking.id !== bookingId
        );


      renderEvents();

      renderBookings();

      updateStatistics();

    }


    function renderBookings() {

      const container =
        document.getElementById(
          "bookingsContainer"
        );


      if (bookings.length === 0) {

        container.innerHTML = `
          <div class="empty">
            <h3>No bookings yet</h3>
            <p>
              Choose an event above to book your tickets.
            </p>
          </div>
        `;

        document.getElementById(
          "bookingTotal"
        ).textContent = "KSh 0";

        return;

      }


      const html =
        bookings.map(booking => {

          const subtotal =
            booking.price *
            booking.quantity;


          return `

            <div class="booking-item">

              <div class="booking-info">

                <h3>
                  ${booking.title}
                </h3>

                <p>
                  KSh ${booking.price.toLocaleString()}
                  per ticket
                </p>

              </div>


              <div class="booking-controls">

                <button
                  class="quantity-button"
                  onclick="changeQuantity(
                    ${booking.id},
                    -1
                  )"
                >
                  -
                </button>


                <strong>
                  ${booking.quantity}
                </strong>


                <button
                  class="quantity-button"
                  onclick="changeQuantity(
                    ${booking.id},
                    1
                  )"
                >
                  +
                </button>


                <strong>
                  KSh ${subtotal.toLocaleString()}
                </strong>


                <button
                  class="remove-button"
                  onclick="removeBooking(
                    ${booking.id}
                  )"
                >
                  Remove
                </button>

              </div>

            </div>

          `;

        }).join("");


      container.innerHTML = html;


      const total =
        calculate(
          bookings,
          (sum, booking) =>
            sum +
            booking.price *
            booking.quantity,
          0
        );


      document.getElementById(
        "bookingTotal"
      ).textContent =
        `KSh ${total.toLocaleString()}`;

    }


    function updateStatistics() {

      const totalTickets =
        calculate(
          bookings,
          (total, booking) =>
            total + booking.quantity,
          0
        );


      const totalSpent =
        calculate(
          bookings,
          (total, booking) =>
            total +
            booking.price *
            booking.quantity,
          0
        );


      const bookedEvents =
        bookings.length;


      document.getElementById(
        "eventCount"
      ).textContent = events.length;


      document.getElementById(
        "bookedEvents"
      ).textContent = bookedEvents;


      document.getElementById(
        "totalTickets"
      ).textContent = totalTickets;


      document.getElementById(
        "totalSpent"
      ).textContent =
        `KSh ${totalSpent.toLocaleString()}`;


      document.getElementById(
        "bookingCount"
      ).textContent = totalTickets;

    }


    function formatDate(date) {

      return new Date(date).toLocaleDateString(
        "en-KE",
        {
          year: "numeric",
          month: "short",
          day: "numeric"
        }
      );

    }


    function scrollToBookings() {

      document
        .getElementById("bookingsSection")
        .scrollIntoView({
          behavior: "smooth"
        });

    }


    document
      .getElementById("searchInput")
      .addEventListener(
        "input",
        renderEvents
      );


    document
      .getElementById("categoryFilter")
      .addEventListener(
        "change",
        renderEvents
      );


    document
      .getElementById("locationFilter")
      .addEventListener(
        "change",
        renderEvents
      );


    document
      .getElementById("sortSelect")
      .addEventListener(
        "change",
        renderEvents
      );


    initializeFilters();

    renderEvents();

    renderBookings();

    updateStatistics();

  </script>

</body>
</html>
